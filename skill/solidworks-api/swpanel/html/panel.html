<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Claude</title>
<!-- Hosted by Shell.Explorer.2 (IE11 engine) inside the SolidWorks Task Pane: no CSS variables, no grid, no
     :focus-within. Colours are written out; the palette is at the top of this comment.
     bg #0d1117  panel #141b24  line #233041  text #d7e0ea  dim #7d8b9c
     cyan #38c8f0 (Claude / numbers)  amber #f5a524 (manufacturing)  green #34d399 (optimisation)
     violet #a78bfa (why)  red #f87171 (warning) -->
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; color: #d7e0ea; background: #0d1117;
         display: flex; flex-direction: column; overflow: hidden; }
  .ic { font-family: "Segoe MDL2 Assets"; font-style: normal; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; }

  /* header */
  #brand { background: #0a0e13; color: #7d8b9c; font: 10px Consolas, monospace; letter-spacing: 1.5px;
           padding: 3px 10px; border-bottom: 1px solid #1a2330; }
  #brand b { color: #38c8f0; font-weight: 400; }
  #top { background: #141b24; height: 40px; display: flex; align-items: center; padding: 0 6px;
         border-bottom: 1px solid #233041; }
  #logo { width: 24px; height: 24px; border-radius: 6px; margin: 0 4px 0 6px; flex: none; text-align: center;
          line-height: 24px; font-weight: 700; font-size: 13px; color: #0d1117;
          background: linear-gradient(135deg, #38c8f0 0%, #6d8bff 100%); }
  #top .title { flex: 1; padding: 0 6px; line-height: 1.15; }
  #top .title .t1 { font-size: 13px; font-weight: 600; color: #eef3f8; }
  #top .title .t2 { font-size: 11px; color: #7d8b9c; }
  .led { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399;
         box-shadow: 0 0 6px #34d399; margin-left: 4px; vertical-align: middle; }
  .tbtn { background: transparent; border: 1px solid transparent; color: #9fb0c3; width: 30px; height: 30px;
          cursor: pointer; font-size: 14px; border-radius: 6px; }
  .tbtn:hover { background: #1c2633; border-color: #2c3b4f; color: #38c8f0; }

  /* telemetry strip: selection + save folder */
  #info { padding: 5px 10px; font-size: 11px; background: #10161e; border-bottom: 1px solid #1a2330; }
  #info div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 1px 0; }
  #info .k { display: inline-block; min-width: 34px; font: 9px Consolas, monospace; letter-spacing: 1px;
             color: #0d1117; background: #3a4a5e; border-radius: 3px; padding: 0 4px; margin-left: 6px;
             text-align: center; }
  #info .k.sel { background: #38c8f0; }
  #info .v { direction: ltr; unicode-bidi: embed; color: #b9c7d6; font-family: Consolas, monospace; }

  /* chat on a faint engineering grid */
  #chat { flex: 1; overflow-y: auto; padding: 12px 10px 4px 10px; background-color: #0d1117;
          background-image: linear-gradient(rgba(56,200,240,.035) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(56,200,240,.035) 1px, transparent 1px);
          background-size: 16px 16px; }
  .row { display: flex; margin: 0 0 14px 0; }
  .av { width: 26px; height: 26px; border-radius: 7px; flex: none; color: #0d1117; font-weight: 700;
        font-size: 12px; text-align: center; line-height: 26px; margin-left: 8px; }
  .row.ai .av { background: linear-gradient(135deg, #38c8f0 0%, #6d8bff 100%); }
  .row.me .av { background: #3a4a5e; color: #d7e0ea; }
  .body { flex: 1; min-width: 0; }
  .who { font-size: 11px; color: #9fb0c3; font-weight: 600; margin-bottom: 4px; }
  .who .role { font: 9px Consolas, monospace; letter-spacing: 1px; color: #38c8f0; border: 1px solid #23506a;
               border-radius: 3px; padding: 0 4px; margin-right: 6px; font-weight: 400; }
  .who span.tm { color: #5d6b7c; font-weight: 400; margin-right: 6px; font-family: Consolas, monospace; }
  .msg { display: block; background: #141b24; border: 1px solid #233041; border-right: 2px solid #38c8f0;
         border-radius: 8px; padding: 8px 10px; word-wrap: break-word; line-height: 1.55; }
  .row.me .msg { background: #182230; border-color: #2a3a4e; border-right-color: #6b7f96; }
  .msg.err { background: #2a1416; border-color: #5b2328; border-right-color: #f87171; color: #fecaca; }
  .msg b { font-weight: 600; color: #ffffff; }
  .num { font-family: Consolas, monospace; color: #38c8f0; direction: ltr; unicode-bidi: embed; }
  .num.he { direction: rtl; font-family: "Segoe UI", Arial, sans-serif; }
  .li { padding-right: 12px; position: relative; }
  .li:before { content: ""; position: absolute; right: 2px; top: .7em; width: 4px; height: 4px; background: #38c8f0;
               border-radius: 1px; }

  /* engineering insight cards: lines that start with [ייצור] [ייעול] [למה] [שים לב] [הנחה] */
  .ins { margin: 7px 0 2px 0; padding: 6px 8px; border-radius: 6px; background: #10161e; border: 1px solid #233041;
         border-right-width: 3px; }
  .ins .tag { display: inline-block; font: 9px Consolas, monospace; letter-spacing: 1px; border-radius: 3px;
              padding: 0 5px; margin-left: 6px; color: #0d1117; vertical-align: 1px; }
  .ins.mfg { border-right-color: #f5a524; } .ins.mfg .tag { background: #f5a524; }
  .ins.opt { border-right-color: #34d399; } .ins.opt .tag { background: #34d399; }
  .ins.why { border-right-color: #a78bfa; } .ins.why .tag { background: #a78bfa; }
  .ins.warn { border-right-color: #f87171; } .ins.warn .tag { background: #f87171; }
  .ins.asm { border-right-color: #7d8b9c; } .ins.asm .tag { background: #7d8b9c; }

  .card { margin-top: 8px; }
  .card button { font: inherit; font-size: 12px; padding: 4px 16px; margin-left: 6px; border-radius: 6px;
                 cursor: pointer; }
  .ok { background: #38c8f0; color: #0d1117; border: 1px solid #38c8f0; font-weight: 600; }
  .ok:hover { background: #5fd6f5; }
  .no { background: transparent; color: #d7e0ea; border: 1px solid #3a4a5e; }
  .no:hover { border-color: #7d8b9c; }
  .sys { text-align: center; margin: 2px 0 14px 0; }
  .sys span { font: 10px Consolas, monospace; color: #7d8b9c; background: #10161e; border: 1px solid #1f2a38;
              border-radius: 10px; padding: 2px 10px; }

  /* working state: label + scanning bar + one live step line */
  #busy { display: none; padding: 4px 12px 6px 12px; background: #0d1117; }
  #busy .pill { font: 10px Consolas, monospace; letter-spacing: 1px; color: #38c8f0; }
  #scan { height: 2px; background: #1a2330; overflow: hidden; margin-top: 4px; position: relative; }
  #scan div { position: absolute; top: 0; height: 2px; width: 30%; background: linear-gradient(90deg,
              rgba(56,200,240,0) 0%, #38c8f0 50%, rgba(56,200,240,0) 100%); animation: scan 1.4s linear infinite; }
  @keyframes scan { 0% { right: -30%; } 100% { right: 100%; } }
  .dot { animation: blink 1.2s infinite; }
  .dot.d2 { animation-delay: .2s; } .dot.d3 { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  #step { font: 10px Consolas, monospace; color: #5d6b7c; direction: ltr; white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; padding-top: 3px; }

  /* input */
  #bottom { padding: 8px 8px 4px 8px; border-top: 1px solid #1a2330; background: #10161e; }
  #att { font-size: 11px; color: #f5a524; padding: 0 4px 4px 4px; }
  #pill { display: flex; align-items: flex-end; border: 1px solid #2c3b4f; border-radius: 10px; padding: 3px 4px;
          background: #0d1117; }
  #pill.focus { border-color: #38c8f0; box-shadow: 0 0 0 1px rgba(56,200,240,.25), 0 0 12px rgba(56,200,240,.15); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; height: 40px; padding: 5px 4px;
             background: transparent; color: #eef3f8; }
  .cbtn { width: 30px; height: 30px; border-radius: 7px; border: 0; cursor: pointer; flex: none; font-size: 14px;
          margin: 0 2px; }
  #plus { background: #1c2633; color: #9fb0c3; }
  #plus:hover { color: #38c8f0; }
  #send { background: #38c8f0; color: #0d1117; font-size: 14px; }
  #send:hover { background: #5fd6f5; }
  #stop { background: #3a1a1d; color: #f87171; display: none; }
  #chips { padding: 5px 2px 0 2px; white-space: nowrap; overflow: hidden; }
  .chip { display: inline-block; font-size: 10px; color: #9fb0c3; border: 1px solid #2c3b4f; border-radius: 10px;
          padding: 1px 8px; margin-left: 4px; cursor: pointer; background: #10161e; }
  .chip:hover { color: #38c8f0; border-color: #38c8f0; }
  #foot { font: 9px Consolas, monospace; color: #4f5d6d; text-align: center; padding: 4px 0 0 0; }

  /* live steps while Claude works: one line per step, in plain words */
  #steps { padding: 2px 0 0 0; }
  .st { font-size: 11px; color: #9fb0c3; padding: 1px 0; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; }
  .st .ico { display: inline-block; width: 14px; text-align: center; margin-left: 4px; }
  .st.done .ico { color: #34d399; } .st.fail .ico { color: #f87171; } .st.fail { color: #fecaca; }
  .st.now { color: #eef3f8; } .st.now .ico { color: #38c8f0; }
  .spin { display: inline-block; width: 8px; height: 8px; border: 2px solid #38c8f0; border-right-color: transparent;
          border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -1px; }
  @keyframes rot { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .st.more { color: #5d6b7c; font-size: 10px; }
  /* after a reply: "5 steps · 14 s" - click to see them */
  .trace { font-size: 10px; color: #7d8b9c; cursor: pointer; margin: -8px 34px 12px 0; }
  .trace:hover { color: #38c8f0; }
  .trace-list { margin: -6px 34px 12px 0; padding: 4px 8px; border: 1px solid #1f2a38; border-radius: 6px;
                background: #10161e; }
  /* a plan Claude proposes before bigger work */
  .plan { margin-top: 8px; border: 1px solid #23506a; border-radius: 6px; background: #0f1a24; padding: 6px 8px; }
  .plan .ph { font-size: 10px; letter-spacing: 1px; color: #38c8f0; margin-bottom: 4px; }
  .plan .pi { padding: 2px 0; }
  .plan .pn { display: inline-block; min-width: 16px; color: #38c8f0; font-family: Consolas, monospace; }
  .card .ghost { background: transparent; color: #9fb0c3; border: 1px solid #2c3b4f; }
  /* small menu under the ... button */
  #menu { display: none; position: absolute; top: 40px; left: 6px; z-index: 5; background: #141b24;
          border: 1px solid #2c3b4f; border-radius: 6px; padding: 4px 0; min-width: 170px; }
  #menu div { padding: 6px 12px; cursor: pointer; font-size: 12px; }
  #menu div:hover { background: #1c2633; color: #38c8f0; }
  #menu .mdir { font-size: 10px; color: #7d8b9c; cursor: default; white-space: nowrap; overflow: hidden;
                text-overflow: ellipsis; max-width: 220px; }
  #menu .mdir:hover { background: transparent; color: #7d8b9c; }
  #top { position: relative; }
  #top .title .t2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

  /* language flags (top bar): the active one bright, the other dimmed */
  .flag { background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 2px; margin: 0 1px;
          cursor: pointer; opacity: .4; line-height: 0; }
  .flag:hover { opacity: .8; }
  .flag.on { opacity: 1; border-color: #2c3b4f; }
  .flag svg { display: block; }

  /* English: left-to-right. The rules above are written for Hebrew (accent on the right); mirror them here. */
  body.ltr .av { margin-left: 0; margin-right: 8px; }
  body.ltr .who .role, body.ltr .who span.tm { margin-right: 0; margin-left: 6px; }
  body.ltr .msg { border-right: 1px solid #233041; border-left: 2px solid #38c8f0; }
  body.ltr .row.me .msg { border-right-color: #2a3a4e; border-left-color: #6b7f96; }
  body.ltr .msg.err { border-right-color: #5b2328; border-left-color: #f87171; }
  body.ltr .li { padding-right: 0; padding-left: 12px; }
  body.ltr .li:before { right: auto; left: 2px; }
  body.ltr .ins { border-right-width: 1px; border-right-color: #233041; border-left-width: 3px; }
  body.ltr .ins.mfg { border-left-color: #f5a524; } body.ltr .ins.opt { border-left-color: #34d399; }
  body.ltr .ins.why { border-left-color: #a78bfa; } body.ltr .ins.warn { border-left-color: #f87171; }
  body.ltr .ins.asm { border-left-color: #7d8b9c; }
  body.ltr .ins .tag, body.ltr #info .k { margin-left: 0; margin-right: 6px; }
  body.ltr .card button { margin-left: 0; margin-right: 6px; }
  body.ltr .chip { margin-left: 0; margin-right: 4px; }
  body.ltr .st .ico { margin-left: 0; margin-right: 4px; }
  body.ltr .trace, body.ltr .trace-list { margin-right: 0; margin-left: 34px; }
  body.ltr #menu { left: auto; right: 6px; }
</style>
<script>
  function act(a) { document.getElementById('flag').value = a; }
  function keyd(e) { e = e || window.event; if (e.keyCode == 13 && !e.shiftKey) { act('send'); return false; } }
  function foc(on) { document.getElementById('pill').className = on ? 'focus' : ''; }
  // quick prompts: fill the box (the user can edit before sending)
  function ask(t) { var r = document.getElementById('req'); r.value = t; r.focus(); }

  // Two languages. Python keeps the same choice in settings.json ("lang") and opens the page as panel.html#he / #en.
  // Keys here = the static labels; swpanel_taskpane.py TXT holds the lines Python writes into the chat.
  var L = {
    he: { dir: 'rtl', title: 'מהנדס Claude', folder: 'תיקיית שמירה', newchat: 'שיחה חדשה', file: 'צרף קובץ',
          menu: 'עוד', working: 'עובד', dirnow: 'שומר ב:',
          stop: 'עצור', send: 'שלח', ph: 'מה לעשות? (Enter שולח, Shift+Enter שורה חדשה)',
          foot: 'Claude עלול לטעות - בדוק מידות חשובות מול ספק / שרטוט.',
          chips: [['בדיקת ייצור', 'בדוק את החלק לייצור: באיזו שיטה הכי נכון לייצר אותו ומה כדאי לשנות'],
                  ['ייעול ועלות', 'איך להוזיל או לפשט את החלק / ההרכבה בלי לפגוע בתפקוד?'],
                  ['הסבר מודל', 'הסבר לי את המודל: מה מניע מה ואיך משנים אותו']] },
    en: { dir: 'ltr', title: 'Claude engineer', folder: 'Save folder', newchat: 'New chat', file: 'Attach file',
          menu: 'More', working: 'Working', dirnow: 'Saving to:',
          stop: 'Stop', send: 'Send', ph: 'What should I do? (Enter sends, Shift+Enter new line)',
          foot: 'Claude can make mistakes - check critical dimensions against the supplier / drawing.',
          chips: [['Manufacturing check', 'Check this part for manufacturing: which method suits it best and what should change'],
                  ['Cost & simplify', 'How can this part / assembly be made cheaper or simpler without hurting its function?'],
                  ['Explain model', 'Explain this model: what drives what and how to change it']] }
  };
  var cur = 'he';
  function byId(i) { return document.getElementById(i); }
  function setLang(l) {
    if (!L[l]) { l = 'he'; }
    cur = l;
    var t = L[l], i, c = '';
    document.documentElement.dir = t.dir;
    document.documentElement.lang = l;
    document.body.className = t.dir;
    byId('t1txt').innerText = t.title;
    byId('bnew').title = t.newchat; byId('plus').title = t.file; byId('bmenu').title = t.menu;
    byId('m_folder').innerText = t.folder; byId('m_new').innerText = t.newchat; byId('m_file').innerText = t.file;
    byId('wk').innerText = t.working; byId('mdirk').innerText = t.dirnow;
    byId('stop').title = t.stop; byId('send').title = t.send;
    byId('req').placeholder = t.ph;
    byId('foot').innerText = t.foot;
    for (i = 0; i < t.chips.length; i++) {
      c += '<span class="chip" onclick="ask(L[cur].chips[' + i + '][1])">' + t.chips[i][0] + '</span>';
    }
    byId('chips').innerHTML = c;
    byId('fl_he').className = 'flag' + (l == 'he' ? ' on' : '');
    byId('fl_en').className = 'flag' + (l == 'en' ? ' on' : '');
  }
  function tog(el) { var n = el.nextSibling; if (n) { n.style.display = n.style.display == 'none' ? 'block' : 'none'; } }
  function menu(on) { byId('menu').style.display = on ? 'block' : 'none'; }
  function mact(a) { menu(false); act(a); }
  document.onclick = function (e) {
    e = e || window.event; var t = e.target || e.srcElement;
    if (t && t.id != 'bmenu' && !(t.parentNode && t.parentNode.id == 'bmenu')) { menu(false); }
  };
  function pickLang(l) { if (l != cur) { setLang(l); act('lang:' + l); } }
  function fromHash() { setLang((location.hash || '#he').substring(1)); }
  window.onload = fromHash;
  window.onhashchange = fromHash;
</script>
</head>
<body>
<div id="top">
  <div id="logo">C</div>
  <div class="title"><div class="t1"><span id="t1txt">מהנדס Claude</span> <span class="led"></span></div>
    <div class="t2" id="sel">...</div></div>
  <button class="flag on" id="fl_he" onclick="pickLang('he')" title="עברית">
    <svg width="18" height="13" viewBox="0 0 220 160"><rect width="220" height="160" fill="#fff"/>
      <rect y="15" width="220" height="25" fill="#0038b8"/><rect y="120" width="220" height="25" fill="#0038b8"/>
      <polygon points="110,47 138.6,96.5 81.4,96.5" fill="none" stroke="#0038b8" stroke-width="6"/>
      <polygon points="110,113 138.6,63.5 81.4,63.5" fill="none" stroke="#0038b8" stroke-width="6"/></svg></button>
  <button class="flag" id="fl_en" onclick="pickLang('en')" title="English">
    <svg width="18" height="13" viewBox="0 0 60 30" preserveAspectRatio="none">
      <clipPath id="uk_s"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
      <clipPath id="uk_t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
      <g clip-path="url(#uk_s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
        <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
        <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk_t)" stroke="#C8102E" stroke-width="4"/>
        <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
        <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
  <button class="tbtn" id="bnew" onclick="act('new')" title="שיחה חדשה"><i class="ic">&#xE710;</i></button>
  <button class="tbtn" id="bmenu" onclick="menu(byId('menu').style.display != 'block')" title="עוד"><i class="ic">&#xE712;</i></button>
  <div id="menu">
    <div id="m_folder" onclick="mact('folder')">תיקיית שמירה</div>
    <div id="m_file" onclick="mact('file')">צרף קובץ</div>
    <div id="m_new" onclick="mact('new')">שיחה חדשה</div>
    <div class="mdir"><span id="mdirk">שומר ב:</span> <span id="dir" dir="ltr">...</span></div>
  </div>
</div>
<div id="chat"></div>
<div id="busy"><span class="pill"><span id="wk">עובד</span><span class="dot">.</span><span class="dot d2">.</span><span class="dot d3">.</span></span>
  <div id="scan"><div></div></div>
  <div id="steps"></div></div>
<div id="bottom">
  <div id="att"></div>
  <div id="pill">
    <button class="cbtn" id="plus" onclick="act('file')" title="צרף קובץ"><i class="ic">&#xE723;</i></button>
    <textarea id="req" onkeydown="return keyd(event)" onfocus="foc(1)" onblur="foc(0)"
              placeholder="מה לעשות? (Enter שולח, Shift+Enter שורה חדשה)"></textarea>
    <button class="cbtn" id="stop" onclick="act('stop')" title="עצור"><i class="ic">&#xE71A;</i></button>
    <button class="cbtn" id="send" onclick="act('send')" title="שלח"><i class="ic">&#xE725;</i></button>
  </div>
  <div id="chips">
    <span class="chip" onclick="ask('בדוק את החלק לייצור: באיזו שיטה הכי נכון לייצר אותו ומה כדאי לשנות')">בדיקת ייצור</span>
    <span class="chip" onclick="ask('איך להוזיל או לפשט את החלק / ההרכבה בלי לפגוע בתפקוד?')">ייעול ועלות</span>
    <span class="chip" onclick="ask('הסבר לי את המודל: מה מניע מה ואיך משנים אותו')">הסבר מודל</span>
  </div>
  <div id="foot">Claude עלול לטעות - בדוק מידות חשובות מול ספק / שרטוט.</div>
</div>
<input type="hidden" id="flag" value="">
</body>
</html>
