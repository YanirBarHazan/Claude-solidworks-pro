<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Claude</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; color: #1f2329; background: #fff;
         display: flex; flex-direction: column; overflow: hidden; }
  .ic { font-family: "Segoe MDL2 Assets"; font-style: normal; }
  #brand { background: #f3f3f3; color: #555; font-size: 11px; padding: 3px 10px; border-bottom: 1px solid #e3e3e3; }
  #top { background: #1f5fa8; color: #fff; height: 34px; display: flex; align-items: center; padding: 0 6px; }
  #top .title { flex: 1; font-size: 14px; font-weight: 600; padding: 0 6px; }
  .tbtn { background: transparent; border: 0; color: #fff; width: 30px; height: 30px; cursor: pointer;
          font-size: 15px; border-radius: 4px; }
  .tbtn:hover { background: #2f72bf; }
  #info { padding: 4px 10px; font-size: 11px; color: #6b7280; background: #fafbfc; border-bottom: 1px solid #eceef1; }
  #info div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .v { direction: ltr; unicode-bidi: embed; color: #1f5fa8; }
  #chat { flex: 1; overflow-y: auto; padding: 10px 10px 4px 10px; background: #fff; }
  .row { display: flex; margin: 0 0 12px 0; }
  .av { width: 28px; height: 28px; border-radius: 50%; flex: none; color: #fff; font-weight: 600;
        font-size: 13px; text-align: center; line-height: 28px; margin-left: 8px; }
  .row.ai .av { background: #d97757; }
  .row.me .av { background: #5b6b7f; }
  .body { flex: 1; min-width: 0; }
  .who { font-size: 11px; color: #374151; font-weight: 600; margin-bottom: 3px; }
  .who span { color: #9ca3af; font-weight: 400; margin-right: 6px; }
  .msg { display: inline-block; max-width: 100%; background: #f1f3f5; border-radius: 10px; padding: 7px 10px;
         white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; }
  .row.me .msg { background: #e7f0fb; }
  .msg.err { background: #fdecea; color: #8a1c10; }
  .msg b { font-weight: 600; }
  .card { margin-top: 6px; }
  .card button { font: inherit; padding: 4px 14px; margin-left: 6px; border-radius: 14px; cursor: pointer; }
  .ok { background: #1f5fa8; color: #fff; border: 1px solid #1f5fa8; }
  .no { background: #fff; color: #374151; border: 1px solid #c9ced6; }
  .sys { text-align: center; margin: 2px 0 12px 0; }
  .sys span { font-size: 11px; color: #6b7280; background: #f3f4f6; border-radius: 10px; padding: 2px 10px; }
  #busy { display: none; text-align: center; padding: 2px 0 6px 0; }
  #busy .pill { display: inline-block; background: #e7f0fb; color: #1f5fa8; font-size: 11px; border-radius: 12px;
                padding: 3px 12px; }
  .dot { animation: blink 1.2s infinite; }
  .dot.d2 { animation-delay: .2s; } .dot.d3 { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  #step { font-size: 10px; color: #9ca3af; direction: ltr; white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; padding: 2px 12px 0 12px; }
  #bottom { padding: 6px 8px 4px 8px; border-top: 1px solid #eceef1; }
  #att { font-size: 11px; color: #6b7280; padding: 0 4px 3px 4px; }
  #pill { display: flex; align-items: flex-end; border: 1px solid #c9ced6; border-radius: 18px; padding: 3px 4px;
          background: #fff; }
  #pill:focus-within { border-color: #1f5fa8; }
  textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; height: 38px; padding: 5px 4px;
             background: transparent; }
  .cbtn { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; flex: none; font-size: 14px;
          margin: 0 2px; }
  #plus { background: #1f5fa8; color: #fff; }
  #send { background: transparent; color: #1f5fa8; font-size: 16px; }
  #stop { background: transparent; color: #b42318; display: none; }
  #foot { font-size: 10px; color: #9ca3af; text-align: center; padding: 3px 0 0 0; }
</style>
<script>
  function act(a) { document.getElementById('flag').value = a; }
  function keyd(e) { e = e || window.event; if (e.keyCode == 13 && !e.shiftKey) { act('send'); return false; } }
</script>
</head>
<body>
<div id="brand">Claude for SolidWorks</div>
<div id="top">
  <span class="title">שיחה</span>
  <button class="tbtn" onclick="act('folder')" title="תיקיית שמירה"><i class="ic">&#xE8B7;</i></button>
  <button class="tbtn" onclick="act('new')" title="שיחה חדשה"><i class="ic">&#xE710;</i></button>
</div>
<div id="info">
  <div>בחירה: <span class="v" id="sel">...</span></div>
  <div>שמירה ב: <span class="v" id="dir">...</span></div>
</div>
<div id="chat"></div>
<div id="busy"><span class="pill">Claude עובד<span class="dot">.</span><span class="dot d2">.</span><span class="dot d3">.</span></span>
  <div id="step"></div></div>
<div id="bottom">
  <div id="att"></div>
  <div id="pill">
    <button class="cbtn" id="plus" onclick="act('file')" title="צרף קובץ"><i class="ic">&#xE710;</i></button>
    <textarea id="req" onkeydown="return keyd(event)" placeholder="מה לעשות? (Enter שולח, Shift+Enter שורה חדשה)"></textarea>
    <button class="cbtn" id="stop" onclick="act('stop')" title="עצור"><i class="ic">&#xE71A;</i></button>
    <button class="cbtn" id="send" onclick="act('send')" title="שלח"><i class="ic">&#xE725;</i></button>
  </div>
  <div id="foot">Claude עלול לטעות - בדוק מידות חשובות.</div>
</div>
<input type="hidden" id="flag" value="">
</body>
</html>
